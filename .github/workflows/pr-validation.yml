name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for better analysis
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore MAUI workloads
      run: |
        echo "Restoring workloads for PR validation..."
        # Only install Android workload for Ubuntu
        sudo dotnet workload install android || \
        dotnet workload install android || \
        echo "Android workload installation failed, but validation can continue..."
      
    - name: Install workloads and restore dependencies
      shell: bash
      run: |
        echo "Installing workloads for PR validation..."
        # Install platform-specific MAUI workload based on runner OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "Installing Windows MAUI workload..."
          dotnet workload install maui-windows
          if [ $? -ne 0 ]; then
            echo "Manual workload installation failed, trying workload restore..."
            dotnet workload restore PosterFly.csproj || echo "Workload restore failed, but continuing..."
          fi
          echo "Restoring dependencies for Windows..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-windows10.0.19041.0
        else
          echo "Installing Android MAUI workload for Ubuntu..."
          sudo dotnet workload install maui-android || \
          dotnet workload install maui-android || \
          echo "Manual workload installation failed, trying workload restore..."
          
          dotnet workload restore PosterFly.csproj || \
          sudo dotnet workload restore PosterFly.csproj || \
          echo "Workload restore failed, but continuing..."
          
          echo "Restoring dependencies for Android..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-android
        fi
      
    - name: Check code formatting
      run: |
        # Check if code is properly formatted
        dotnet format PosterFly.csproj --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
    - name: Build solution (Android only on Ubuntu)
      run: dotnet build PosterFly.csproj --configuration Release --no-restore -f net10.0-android
      
    - name: Run static analysis
      run: |
        # Run built-in analyzers
        dotnet build PosterFly.csproj --configuration Release --verbosity normal --no-restore /p:TreatWarningsAsErrors=false /p:WarningLevel=5
      
    - name: Check for common issues
      run: |
        echo "🔍 Checking for common issues..."
        
        # Check for debugging code that shouldn't be committed
        if grep -r "Console.WriteLine\|Debugger.Break\|#if DEBUG" --include="*.cs" .; then
          echo "⚠️ Found debugging code that should be removed"
          exit 1
        fi
        
        # Check for TODO comments (warning only)
        if grep -r "TODO\|FIXME\|HACK" --include="*.cs" .; then
          echo "⚠️ Found TODO/FIXME comments - consider addressing them"
        fi
        
        # Check for hardcoded secrets (basic check)
        if grep -r -i "password\s*=\|apikey\s*=\|secret\s*=" --include="*.cs" --include="*.json" .; then
          echo "❌ Potential hardcoded secrets found"
          exit 1
        fi
        
        echo "✅ No critical issues found"

  test-android-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Restore MAUI Android workloads
      run: |
        echo "Restoring Android workloads for PR validation..."
        # Only install Android workload for Ubuntu
        sudo dotnet workload install android || \
        dotnet workload install android || \
        echo "Android workload installation failed, but continuing..."
      
    - name: Install workloads and restore dependencies
      shell: bash
      run: |
        echo "Installing workloads for PR validation..."
        # Install platform-specific MAUI workload based on runner OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "Installing Windows MAUI workload..."
          dotnet workload install maui-windows
          if [ $? -ne 0 ]; then
            echo "Manual workload installation failed, trying workload restore..."
            dotnet workload restore PosterFly.csproj || echo "Workload restore failed, but continuing..."
          fi
          echo "Restoring dependencies for Windows..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-windows10.0.19041.0
        else
          echo "Installing Android MAUI workload for Ubuntu..."
          sudo dotnet workload install maui-android || \
          dotnet workload install maui-android || \
          echo "Manual workload installation failed, trying workload restore..."
          
          dotnet workload restore PosterFly.csproj || \
          sudo dotnet workload restore PosterFly.csproj || \
          echo "Workload restore failed, but continuing..."
          
          echo "Restoring dependencies for Android..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-android
        fi
      
    - name: Test Android build
      run: dotnet build PosterFly.csproj -c Release -f net10.0-android --no-restore

  test-windows-build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore MAUI Windows workloads
      run: |
        echo "Restoring Windows workloads for PR validation..."
        # Only install Windows workload
        dotnet workload install windows
      
    - name: Install workloads and restore dependencies
      shell: bash
      run: |
        echo "Installing workloads for PR validation..."
        # Install platform-specific MAUI workload based on runner OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "Installing Windows MAUI workload..."
          dotnet workload install maui-windows
          if [ $? -ne 0 ]; then
            echo "Manual workload installation failed, trying workload restore..."
            dotnet workload restore PosterFly.csproj || echo "Workload restore failed, but continuing..."
          fi
          echo "Restoring dependencies for Windows..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-windows10.0.19041.0
        else
          echo "Installing Android MAUI workload for Ubuntu..."
          sudo dotnet workload install maui-android || \
          dotnet workload install maui-android || \
          echo "Manual workload installation failed, trying workload restore..."
          
          dotnet workload restore PosterFly.csproj || \
          sudo dotnet workload restore PosterFly.csproj || \
          echo "Workload restore failed, but continuing..."
          
          echo "Restoring dependencies for Android..."
          dotnet restore PosterFly.csproj /p:TargetFrameworks=net10.0-android
        fi
      
    - name: Test Windows build
      run: dotnet build PosterFly.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore

  # Comment on PR with build results
  pr-comment:
    needs: [validate-pr, test-android-build, test-windows-build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          // Get job results
          const validateResult = '${{ needs.validate-pr.result }}';
          const androidResult = '${{ needs.test-android-build.result }}';
          const windowsResult = '${{ needs.test-windows-build.result }}';
          
          // Create status emojis
          const getStatusEmoji = (result) => {
            switch(result) {
              case 'success': return '✅';
              case 'failure': return '❌';
              case 'cancelled': return '⏹️';
              default: return '⚠️';
            }
          };
          
          const comment = `## 🤖 Build Results
          
          | Check | Status | Result |
          |-------|--------|--------|
          | Code Validation | ${getStatusEmoji(validateResult)} | ${validateResult} |
          | Android Build | ${getStatusEmoji(androidResult)} | ${androidResult} |
          | Windows Build | ${getStatusEmoji(windowsResult)} | ${windowsResult} |
          
          ${validateResult === 'success' && androidResult === 'success' && windowsResult === 'success' 
            ? '🎉 All checks passed! This PR is ready for review.' 
            : '⚠️ Some checks failed. Please review and fix the issues.'}
          
          ---
          *This comment was automatically generated by GitHub Actions*`;
          
          // Check if we already commented on this PR
          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: pr_number
          });
          
          const existingComment = comments.data.find(
            comment => comment.user.login === 'github-actions[bot]' && 
                      comment.body.includes('🤖 Build Results')
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existingComment.id,
              body: comment
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: comment
            });
          }