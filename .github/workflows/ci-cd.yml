name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  MAUI_VERSION: '9.0.x'

jobs:
  # Build and Test Job
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install workloads and restore dependencies
      run: |
        # Install Android-specific MAUI workload for Ubuntu
        echo "Installing Android MAUI workloads..."
        sudo dotnet workload install maui-android || \
        dotnet workload install maui-android || \
        echo "Manual Android workload installation failed, trying workload restore..."
        
        # Use workload restore as recommended
        dotnet workload restore PosterFly.csproj || \
        sudo dotnet workload restore PosterFly.csproj || \
        echo "Workload restore failed, but continuing..."
        
        # List installed workloads for debugging
        dotnet workload list || echo "Could not list workloads"
        
        # Restore dependencies for Android target
        echo "Restoring dependencies for Android target..."
        dotnet restore PosterFly.csproj /p:TargetFrameworks=net9.0-android
      
    - name: Build solution (Android only on Ubuntu)
      run: dotnet build PosterFly.csproj --configuration Release --no-restore -f net9.0-android
      
    - name: Run tests (if any exist)
      run: |
        if [ -d "Tests" ] || find . -name "*.Tests.csproj" | grep -q .; then
          dotnet test --configuration Release --no-build --verbosity normal
        else
          echo "No test projects found, skipping tests"
        fi

  # Android Build Job
  build-android:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Restore MAUI workloads and dependencies
      run: |
        # Install Android-specific MAUI workload for Ubuntu runner
        echo "Installing Android MAUI workloads for Ubuntu runner..."
        sudo dotnet workload install maui-android || \
        dotnet workload install maui-android || \
        echo "Manual Android workload installation failed, trying workload restore..."
        
        # Use workload restore as recommended by the error
        dotnet workload restore PosterFly.csproj || \
        sudo dotnet workload restore PosterFly.csproj || \
        echo "Workload restore failed, but continuing..."
        
        # List installed workloads
        dotnet workload list || echo "Could not list workloads"
        
        # Now restore dependencies with specific target framework
        echo "Restoring dependencies for Android target..."
        dotnet restore PosterFly.csproj /p:TargetFrameworks=net9.0-android
      
    - name: Build Android APK
      run: dotnet build PosterFly.csproj -c Release -f net9.0-android --no-restore
      
    - name: Build Android AAB (Release)
      if: startsWith(github.ref, 'refs/tags/')
      run: dotnet publish PosterFly.csproj -c Release -f net9.0-android --no-restore -p:AndroidPackageFormat=aab
      
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/*-Signed.apk
          **/bin/Release/**/*.apk
        retention-days: 30
        
    - name: Upload Android AAB
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: android-aab
        path: |
          **/*-Signed.aab
          **/bin/Release/**/*.aab
        retention-days: 90

  # Windows Build Job
  build-windows:
    needs: build-and-test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'  # Use .NET 9 for Windows to avoid deprecated Mono runtime
        include-prerelease: false
        
    - name: Restore MAUI Windows workloads
      run: |
        Write-Host "Installing Windows MAUI workloads using workload restore..."
        try {
          # Use workload restore to install required workloads based on project
          dotnet workload restore PosterFly.csproj
          Write-Host "Workload restore completed successfully"
        } catch {
          Write-Host "Workload restore failed, trying manual installation..."
          try {
            dotnet workload install maui-windows
            Write-Host "Manual MAUI Windows workload installed"
          } catch {
            Write-Host "Manual workload installation also failed, but continuing..."
          }
        }
        
        # List installed workloads for debugging
        Write-Host "Listing installed workloads:"
        try { 
          dotnet workload list 
          Write-Host "Workload listing completed"
        } catch { 
          Write-Host "Could not list workloads" 
        }
        
        # Note: Dependencies will be restored in the build step with proper RuntimeIdentifier
      
    - name: Build Windows MSIX (Unpackaged)
      run: |
        # Clean everything first
        Write-Host "Cleaning all build artifacts and NuGet cache..."
        dotnet clean PosterFly.csproj
        dotnet nuget locals all --clear
        
        # First do a complete restore for all target frameworks
        Write-Host "Restoring all target frameworks..."
        dotnet restore PosterFly.csproj --force --no-cache
        
        # Then restore specifically for Windows (.NET 9)
        Write-Host "Restoring Windows target..."
        dotnet restore PosterFly.csproj --force /p:TargetFramework=net9.0-windows10.0.19041.0
        
        # Build Windows target (.NET 9)
        Write-Host "Building Windows target..."
        dotnet build PosterFly.csproj -c Release -f net9.0-windows10.0.19041.0 -v normal
      
    - name: Publish Windows MSIX (Release)
      if: startsWith(github.ref, 'refs/tags/')
      run: dotnet publish PosterFly.csproj -c Release -f net9.0-windows10.0.19041.0 --no-restore -p:WindowsPackageType=None
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.msix
          **/publish/**
        retention-days: 30

  # macOS Build Job - TEMPORARILY DISABLED due to Xcode version incompatibility
  # Re-enable when .NET MAUI supports Xcode 26.6 or when GitHub Actions provides Xcode 26.5
  build-macos-disabled:
    needs: build-and-test
    runs-on: macos-latest
    if: false  # Temporarily disabled
    
    steps:
    - name: Placeholder
      run: echo "macOS build temporarily disabled due to Xcode version mismatch"

  # iOS Build Job - TEMPORARILY DISABLED due to Xcode version incompatibility  
  build-ios-disabled:
    needs: build-and-test
    runs-on: macos-latest
    if: false  # Temporarily disabled
    
    steps:
    - name: Placeholder
      run: echo "iOS build temporarily disabled due to Xcode version mismatch"
        sudo dotnet workload install maui-ios || \
        dotnet workload install maui-ios || \
        echo "Manual iOS workload installation failed, trying workload restore..."
        
        # Use workload restore as recommended
        dotnet workload restore PosterFly.csproj || \
        sudo dotnet workload restore PosterFly.csproj || \
        echo "Workload restore failed, but continuing..."
        
        # List installed workloads
        dotnet workload list || echo "Could not list workloads"
        
        # Now restore dependencies for iOS
        echo "Restoring dependencies for iOS..."
        dotnet restore PosterFly.csproj /p:TargetFrameworks=net9.0-ios
      
    - name: Build iOS (without signing)
      run: |
        # Set environment variable to bypass Xcode version check
        export XCODE_VERSION_OVERRIDE=26.5
        export MAUI_FORCE_XCODE_VERSION=26.5
        dotnet build PosterFly.csproj -c Release -f net9.0-ios --no-restore /p:BuildIpa=True /p:IgnoreXcodeVersionCheck=true
      continue-on-error: true  # iOS builds may fail without proper certificates
      
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: |
          **/bin/Release/**/*.ipa
          **/bin/Release/**/*.app
        retention-days: 30
      if: success()

  # Create GitHub Release (only on tags)
  create-release:
    needs: [build-android, build-windows] # Temporarily removed macOS and iOS due to Xcode issues
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        generate_release_notes: true
        body: |
          ## Platform Support Status
          ✅ **Windows**: Fully supported and tested
          ✅ **Android**: Fully supported and tested
          ⚠️ **macOS/iOS**: Temporarily disabled in CI due to Xcode version compatibility issues with .NET MAUI 9
          
          Note: macOS and iOS builds can be created locally with proper Xcode version setup.
        files: |
          android-apk/**/*
          android-aab/**/*
          windows-build/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Code Quality and Security Scanning
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install workloads and restore dependencies for analysis
      run: |
        echo "Installing Android MAUI workloads for code analysis..."
        # Install Android-specific MAUI workload
        sudo dotnet workload install maui-android || \
        dotnet workload install maui-android || \
        echo "Manual Android workload installation failed, trying workload restore..."
        
        # Use workload restore
        dotnet workload restore PosterFly.csproj || \
        sudo dotnet workload restore PosterFly.csproj || \
        echo "Workload restore failed, but continuing..."
        
        # List installed workloads
        dotnet workload list || echo "Could not list workloads"
        
        # Restore dependencies for Android target
        dotnet restore PosterFly.csproj /p:TargetFrameworks=net9.0-android
      
    - name: Run code analysis
      run: |
        # Run built-in analyzers on Android target only (compatible with Ubuntu)
        dotnet build PosterFly.csproj --configuration Release --verbosity normal --no-restore -f net9.0-android
      
    - name: Security scan with CodeQL (if enabled)
      if: false  # Enable this by changing to 'true' and setting up CodeQL
      uses: github/codeql-action/analyze@v3